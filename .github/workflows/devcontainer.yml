name: Dev Container CI

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build and test Dev Container
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          # Supabase環境変数（CI用ダミー値）
          # 本番環境とローカル開発では .env から読み込まれる実際の値を使用
          env: |
            SEND_EMAIL_HOOK_SECRET=v1,whsec_dummysecretforci1234567890abcdef
            SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID=dummy-google-client-id
            SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET=dummy-google-secret
            SUPABASE_AUTH_EXTERNAL_TWITCH_CLIENT_ID=dummy-twitch-client-id
            SUPABASE_AUTH_EXTERNAL_TWITCH_SECRET=dummy-twitch-secret
          runCmd: |
            pnpm exec supabase start
            pnpm exec supabase db reset
            pnpm exec supabase stop
