name: Dev Container CI

on:
  pull_request:
    paths:
      - ".devcontainer/**"
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Supabase config.toml で参照される環境変数のダミー値
      SEND_EMAIL_HOOK_SECRET: "v1,whsec_dummysecret1234567890abcdefghijk"
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: "dummy-client-id"
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: "dummy-secret"
      SUPABASE_AUTH_EXTERNAL_TWITCH_CLIENT_ID: "dummy-client-id"
      SUPABASE_AUTH_EXTERNAL_TWITCH_SECRET: "dummy-secret"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build and test Dev Container
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          runCmd: |
            pnpm exec supabase start
            pnpm exec supabase db reset
            pnpm exec supabase stop
          env: |
            SEND_EMAIL_HOOK_SECRET
            SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID
            SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET
            SUPABASE_AUTH_EXTERNAL_TWITCH_CLIENT_ID
            SUPABASE_AUTH_EXTERNAL_TWITCH_SECRET
